" y="452.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">承担关键读（强一致）</text><rect x="390" y="316" width="300" height="190" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6" filter="url(#sh6)"/><path d="M 400 316 L 680 316" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><text x="540" y="379.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">备库 Standby</text><text x="540" y="403.05" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">流复制同步（sync）</text><text x="540" y="419.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">故障时自动提升为主</text><text x="540" y="436.05" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">RPO ≤ 1 分钟</text><text x="540" y="452.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">RTO ≤ 60 秒</text><rect x="720" y="316" width="280" height="190" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6" filter="url(#sh7)"/><path d="M 730 316 L 990 316" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><text x="860" y="379.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">只读副本 × 2</text><text x="860" y="403.05" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">异步复制（延迟秒级）</text><text x="860" y="419.55" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">承担报表与审计检索</text><text x="860" y="436.0