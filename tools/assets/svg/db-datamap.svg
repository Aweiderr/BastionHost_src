ft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">账号口令 SM4 加密（密钥在密码机）</text><rect x="1090" y="162" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="184" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">长期在线，删除需审批</text><rect x="30" y="206" width="150" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="228" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">授权策略</text><rect x="180" y="206" width="320" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="228" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">acl_grant / acl_grant_rule</text><rect x="500" y="206" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="228" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库 + 只读副本</text><rect x="750" y="206" width="340" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="228" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">配置文件整体加密</text><rect x="1090" y="206" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="228" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">长期在线，保留变更历史</text><rect x="30" y="250" width="150" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="272" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">会话主记录</text><rect x="180" y="250" width="320" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="272" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">ops_session</text><rect x="500" y="250" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="272" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库（分区）+ 归档库</text><rect x="750" y="250" width="340" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="272" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">关键字段 SM4 加密</text><rect x="1090" y="250" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="272" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">在线 6 个月，归档 3 年</text><rect x="30" y="294" width="150" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="316" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">命令与文件明细</text><rect x="180" y="294" width="320" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="316" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">ops_session_command / ops_session_file</text><rect x="500" y="294" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="316" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库（分区）+ 归档库</text><rect x="750" y="294" width="340" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="316" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">文本字段 SM4 加密，摘要 SM3</text><rect x="1090" y="294" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="316" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">在线 6 个月，归档 3 年</text><rect x="30" y="338" width="150" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="360" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">登录与操作日志</text><rect x="180" y="338" width="320" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="360" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">audit_login_log / audit_operation_log</text><rect x="500" y="338" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="360" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库（分区）+ 检索集群</text><rect x="750" y="338" width="340" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="360" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">签名链 SM3，防篡改</text><rect x="1090" y="338" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="360" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">在线 6 个月，归档 3 年</text><rect x="30" y="382" width="150" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="404" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">告警记录</text><rect x="180" y="382" width="320" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="404" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">audit_alert</text><rect x="500" y="382" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="404" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库 + 检索集群</text><rect x="750" y="382" width="340" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="404" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">—</text><rect x="1090" y="382" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="404" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">在线 12 个月，归档 2 年</text><rect x="30" y="426" width="150" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="448" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">密钥台账</text><rect x="180" y="426" width="320" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="448" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">km_key / km_key_usage</text><rect x="500" y="426" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="448" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">主库（高敏）</text><rect x="750" y="426" width="340" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="448" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">仅存密钥索引与元数据，密钥本体在密码机</text><rect x="1090" y="426" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="448" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">长期，销毁需双人复核</text><rect x="30" y="470" width="150" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="492" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">录像文件</text><rect x="180" y="470" width="320" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="492" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">对象存储（非数据库）</text><rect x="500" y="470" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="492" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">MinIO / Ceph</text><rect x="750" y="470" width="340" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="492" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">SM4 加密 + SM3 分片摘要</text><rect x="1090" y="470" width="250" height="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="492" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">热 30 天 / 温 6 个月 / 冷 3 年</text><rect x="30" y="514" width="150" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="105" y="536" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">临时会话数据</text><rect x="180" y="514" width="320" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="188" y="536" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">Redis（非持久化）</text><rect x="500" y="514" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="508" y="536" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">内存缓存集群</text><rect x="750" y="514" width="340" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="536" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">进程内加密，不落盘</text><rect x="1090" y="514" width="250" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1098" y="536" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">会话结束立即销毁</text><rect x="30" y="600" width="1280" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 4"/><text x="46" y="628" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">数据安全设计要点</text><text x="46" y="654" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#1e40af">① 敏感字段加密：账号口令、证书私钥引用、恢复码等高敏字段使用 SM4-CBC 加密，密钥由密码机保护，应用侧仅持有密钥索引；</text><text x="46" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#1e40af">② 完整性保护：审计类表增加 record_hash 与 prev_hash 字段形成摘要链，写入时计算，校验任务定期扫描并可检出任意篡改；</text><text x="46" y="706" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#1e40af">③ 权限隔离：数据库账号按服务划分（读写账号、只读账号、审计只读账号），审计只读账号无任何写权限，DDL 仅由运维流程执行；</text><text x="46" y="732" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#1e40af">④ 脱敏与最小化：查询接口对身份证号、手机号等个人信息按权限脱敏；导出需审批并记录导出范围、行数、操作人；</text><text x="46" y="758" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#1e40af">⑤ 备份安全：备份文件加密存储，恢复需双人复核；备份介质离线保存与异地存放，定期校验可用性。</text></svg>