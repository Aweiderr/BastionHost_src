 240" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar18)" stroke-linecap="round"/><path d="M 504 432 L 504 430" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ar19)" stroke-linecap="round"/><path d="M 504 582 L 504 580" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#ar20)" stroke-linecap="round"/><path d="M 346 337 L 446 337" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar21)" stroke-linecap="round"/><path d="M 562 337 L 662 337" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar22)" stroke-linecap="round"/><path d="M 778 337 L 878 337" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar23)" stroke-linecap="round"/><path d="M 994 337 L 1094 337" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar24)" stroke-linecap="round"/><rect x="40" y="754" width="1220" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 4"/><text x="56" y="782" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#92400e">分支规则：</text><text x="56" y="806" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#92400e">① 审批通过 → 自动授权并发起运维；② 审批驳回 → 通知申请人并记录原因；③ 审批超时（默认 4 小时）→ 提醒审批人并抄送上级；</text><text x="56" y="828" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#92400e">④ 紧急通道 → 可先运维后补审批，但需全程录像并在 24 小时内补齐审批，逾期自动告警；⑤ 权限到期 → 自动回收并生成回收记录。</text></svg>