" font-size="11.5" fill="#334155" text-anchor="middle">节点与许可管理</text><text x="482" y="681.8375" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">备份与恢复</text><text x="482" y="699.0875" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">不可改审计数据</text><path d="M 262 656 L 336 656" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ar13)" stroke-linecap="round"/><rect x="644" y="576" width="284" height="160" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh14)"/><path d="M 654 576 L 918 576" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="786" y="623.2125" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">安全管理员</text><text x="786" y="647.3375" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">认证与授权策略</text><text x="786" y="664.5875" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">命令与审批策略</text><text x="786" y="681.8375" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">密钥管理职责</text><text x="786" y="699.0875" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">不可删审计记录</text><path d="M 262 656 L 640 656" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ar15)" stroke-linecap="round"/><rect x="948" y="576" width="284" height="160" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6" filter="url(#sh16)"/><path d="M 958 576 L 1222 576" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><text x="1090" y="623.2125" font-famil