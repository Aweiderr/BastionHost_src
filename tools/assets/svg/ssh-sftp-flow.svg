ont-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">三、SFTP 文件传输管控</text><rect x="60" y="664" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="683" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#1e40af">传输前</text><text x="160" y="683" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">文件类型 / 大小 / 数量校验、病毒扫描</text><rect x="60" y="696" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="715" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#1e40af">目录权限</text><text x="160" y="715" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">按资产与账号限定可访问目录，禁越权浏览</text><rect x="60" y="728" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="747" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#1e40af">方向控制</text><text x="160" y="747" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">允许上传 / 允许下载 / 双向 / 仅审计</text><rect x="60" y="760" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="779" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#1e40af">传输中</text><text x="160" y="779" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">进度与速率记录、异常中断可续传、敏感文件水印</text><rect x="60" y="792" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="811" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#1e40af">传输后</text><text x="160" y="811" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">文件清单留痕（名称、大小、摘要、方向、结果）</text><rect x="670" y="636" width="610" height="200" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><rect x="686" y="621.08" width="262" height="26" rx="4" fill="#d97706"/><text x="817" y="639.92" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">四、SSH / SFTP 审计留痕</text><rect x="690" y="664" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="706" y="683" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#92400e">命令级记录</text><text x="800" y="683" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">完整命令原文、时间戳、执行用户、来源 IP、策略命中与结果</text><rect x="690" y="696" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="706" y="715" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#92400e">会话录像</text><text x="800" y="715" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">字符会话逐屏回放，支持按命令跳转定位</text><rect x="690" y="728" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="706" y="747" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#92400e">SFTP 记录</text><text x="800" y="747" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">文件传输明细清单，含摘要用于完整性校验</text><rect x="690" y="760" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="706" y="779" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#92400e">密钥使用记录</text><text x="800" y="779" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">SSH 密钥调用记录，密钥索引与用途</text><rect x="690" y="792" width="570" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="706" y="811" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.8" font-weight="bold" fill="#92400e">转发记录</text><text x="800" y="811" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.4" fill="#334155">端口转发与隧道建立记录，含目标地址与端口</text><text x="660" y="876" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155" text-anchor="middle">设计要点：SSH 与 SFTP 共用同一套托管账号、密钥与策略体系；命令管控在服务端完成，不依赖客户端配合，客户端无法绕过。</text><text x="660" y="900" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155" text-anchor="middle">合规要点：命令记录与录像采用 SM3 摘要链保护，删除需审批，满足等保「安全审计」与密评「数据完整性」要求。</text></svg>