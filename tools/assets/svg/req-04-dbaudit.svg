 UI',sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">限流</text><text x="1076" y="446" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">单位时间内大量查询或导出</text><rect x="40" y="540" width="1160" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 4"/><text x="56" y="570" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#92400e">审计要求：</text><text x="56" y="596" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#92400e">① 记录完整 SQL 原文、执行用户、来源 IP、目标库表、执行时间与影响行数；② 记录结果集的行数与敏感字段脱敏情况；</text><text x="56" y="620" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#92400e">③ 支持按 SQL 关键字、库表名、执行用户、时间范围检索；④ 导出的 SQL 审计数据需加密并附完整性摘要；</text><text x="56" y="644" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#92400e">⑤ 阻断与二次确认事件需实时告警，并在合规报表中统计呈现。</text></svg>