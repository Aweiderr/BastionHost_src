cy="480" r="11" fill="#7c3aed"/><text x="808" y="484.14" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><path d="M 958 546 L 972 546" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar10)" stroke-linecap="round"/><rect x="974" y="462" width="170" height="168" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#sh11)"/><path d="M 984 462 L 1134 462" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/><text x="1059" y="515.475" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">销毁</text><text x="1059" y="540.225" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle">到期或泄露触发</text><text x="1059" y="556.4250000000001" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle">密码机内安全擦除</text><text x="1059" y="572.625" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle">销毁审批与记录</text><text x="1059" y="588.825" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle">不可恢复验证</text><circle cx="994" cy="480" r="11" fill="#475569"/><text x="994" y="484.14" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><rect x="40" y="656" width="1160" height="118" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/><text x="56" y="684" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#1e293b">密码基础设施要求</text><text x="56" y="712" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12" fill="#334155">· 密码运算全部在通过国家密码管理部门认可的密码机 / 密码卡内完成，应用侧不持有明文根密钥。</text><text x="56" y="728" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12" fill="#334155">· 密码设备双机热备，主备状态与会话密钥同步；单台故障不影响存量会话与新建会话。</text><text x="56" y="744" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12" fill="#334155">· 算法与协议实现遵循 GM/T 0024、GM/T 0028 等标准，禁用 MD5、SHA-1、DES、RSA-1024 等弱算法。</text><text x="56" y="760" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12" fill="#334155">· 密钥操作全量审计（谁、何时、对哪把密钥、做什么），审计记录自身使用 SM3 链式摘要防篡改。</text></svg>