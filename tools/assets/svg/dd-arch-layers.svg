 font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#92400e">· 依赖方向自上而下：接入层不直连领域服务，必须经网关层鉴权与限流；领域服务之间通过接口调用，禁止跨层反向依赖；</text><text x="46" y="808" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#92400e">· 协议代理层可调用密钥服务与审计服务，但不直接访问数据库；基础设施层通过仓储接口被领域服务使用，便于替换实现。</text></svg>