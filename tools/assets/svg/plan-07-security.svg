<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><rect width="1240" height="760" fill="#ffffff"/><text x="620" y="36" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">纵深安全防护体系</text><text x="620" y="60" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle">从边界到数据的六层防御 · 默认拒绝 · 最小权限</text><rect x="40" y="100" width="1160" height="72" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.8"/><rect x="40" y="100" width="8" height="72" rx="4" fill="#475569"/><text x="68" y="130" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#475569">物理与环境安全</text><text x="68" y="155" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">机房门禁与视频监控 · 设备上架登记 · 介质管控 · 双路供电与 UPS</text><circle cx="1166" cy="136" r="13" fill="#475569"/><text x="1166" y="140.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><rect x="66" y="184" width="1108" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><rect x="66" y="184" width="8" height="72" rx="4" fill="#2563eb"/><text x="94" y="214" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#2563eb">网络与边界安全</text><text x="94" y="239" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">网络分区与微隔离 · 防火墙白名单 · 防 DDoS 与限流 · 国密 TLS 传输加密</text><circle cx="1140" cy="220" r="13" fill="#2563eb"/><text x="1140" y="224.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><rect x="92" y="268" width="1056" height="72" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><rect x="92" y="268" width="8" height="72" rx="4" fill="#0d9488"/><text x="120" y="298" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#0d9488">主机与系统安全</text><text x="120" y="323" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">最小化安装与基线加固 · 主机入侵检测 · 漏洞与补丁管理 · 安全审计开启</text><circle cx="1114" cy="304" r="13" fill="#0d9488"/><text x="1114" y="308.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><rect x="118" y="352" width="1004" height="72" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><rect x="118" y="352" width="8" height="72" rx="4" fill="#16a34a"/><text x="146" y="382" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#16a34a">应用与接口安全</text><text x="146" y="407" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">身份认证与授权 · 输入校验与防注入 · 接口签名与防重放 · 会话与令牌管理</text><circle cx="1088" cy="388" r="13" fill="#16a34a"/><text x="1088" y="392.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><rect x="144" y="436" width="952" height="72" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/><rect x="144" y="436" width="8" height="72" rx="4" fill="#d97706"/><text x="172" y="466" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#d97706">数据与密码安全</text><text x="172" y="491" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">敏感数据加密存储 · 国密算法合规应用 · 备份加密与完整性校验 · 数据分级分类</text><circle cx="1062" cy="472" r="13" fill="#d97706"/><text x="1062" y="476.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><rect x="170" y="520" width="900" height="72" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><rect x="170" y="520" width="8" height="72" rx="4" fill="#dc2626"/><text x="198" y="550" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#dc2626">身份与运维审计</text><text x="198" y="575" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.3" fill="#334155">统一身份与单点登录 · 特权账号集中托管 · 全量操作审计 · 行为分析与告警</text><circle cx="1036" cy="556" r="13" fill="#dc2626"/><text x="1036" y="560.5" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="620" y="620" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">默认拒绝</text><text x="620" y="646" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">任何未显式授权的访问一律拒绝；所有特权操作必须经过堡垒机并留下不可篡改记录。</text><rect x="40" y="674" width="1160" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 4"/><text x="56" y="700" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" fill="#991b1b">安全运营闭环：资产发现 → 风险识别 → 策略收敛 → 行为监测 → 事件响应 → 复盘改进，与堡垒机审计数据联动形成常态化运营。</text><text x="56" y="722" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" fill="#991b1b">等保 2.0 三级「安全审计」「访问控制」「身份鉴别」条款均可由本体系的审计与授权能力直接覆盖。</text></svg>