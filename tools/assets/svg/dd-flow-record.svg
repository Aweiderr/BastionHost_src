      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter></defs><rect width="1320" height="720" fill="#ffffff"/><text x="660" y="32" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">业务流程图：会话录像采集、加密与封存</text><text x="660" y="56" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12" fill="#64748b" text-anchor="middle">实时采集 → 分片加密 → 摘要链 → 对象存储 → 索引建立 → 完整性校验</text><rect x="30" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh1)"/><path d="M 40 100 L 218 100" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="129" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">① 实时采集</text><text x="129" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">字符流 / 画面帧</text><text x="129" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">按时间与大小切分</text><text x="129" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">10 MB 或 60 秒一片</text><path d="M 229 165 L 245 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar2)" stroke-linecap="round"/><rect x="246" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#sh3)"/><path d="M 256 100 L 434 100" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/><text x="345" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">② 分片加密</text><text x="345" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">SM4-CBC 加密</text><text x="345" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">会话密钥一次一密</text><text x="345" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">密钥索引随片记录</text><path d="M 445 165 L 461 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar4)" stroke-linecap="round"/><rect x="462" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh5)"/><path d="M 472 100 L 650 100" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><text x="561" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">③ 摘要计算</text><text x="561" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">SM3 计算分片摘要</text><text x="561" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">链接前片摘要</text><text x="561" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">形成摘要链</text><path d="M 661 165 L 677 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar6)" stroke-linecap="round"/><rect x="678" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6" filter="url(#sh7)"/><path d="M 688 100 L 866 100" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/><text x="777" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">④ 上传存储</text><text x="777" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">对象存储多副本</text><text x="777" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">纠删码 4+2</text><text x="777" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">断点续传与重试</text><path d="M 877 165 L 893 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar8)" stroke-linecap="round"/><rect x="894" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6" filter="url(#sh9)"/><path d="M 904 100 L 1082 100" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><text x="993" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">⑤ 索引建立</text><text x="993" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">会话 ID + 分片号</text><text x="993" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">时间范围 + 命令偏移</text><text x="993" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">写入检索索引</text><path d="M 1093 165 L 1109 165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar10)" stroke-linecap="round"/><rect x="1110" y="100" width="198" height="130" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6" filter="url(#sh11)"/><path d="M 1120 100 L 1298 100" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><text x="1209" y="143.04999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">⑥ 封存校验</text><text x="1209" y="165.29999999999998" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">会话结束生成清单</text><text x="1209" y="180.74999999999997" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">整体摘要与签名</text><text x="1209" y="196.2" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.3" fill="#334155" text-anchor="middle">定期批量校验</text><rect x="30" y="275" width="4" height="18" rx="2" fill="#2563eb"/><text x="42" y="290" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#0f172a">存储分层与生命周期</text><rect x="30" y="308" width="1260" height="38" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><rect x="30" y="308" width="6" height="38" rx="3" fill="#16a34a"/><text x="48" y="332" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#16a34a">热数据（在线）</text><text x="200" y="332" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#0f172a">近 30 天录像与日志</text><text x="420" y="332" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155">对象存储 SSD 池</text><text x="1276" y="332" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#64748b" text-anchor="end">支持秒级回放与检索</text><rect x="30" y="352" width="1260" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><rect x="30" y="352" width="6" height="38" rx="3" fill="#2563eb"/><text x="48" y="376" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#2563eb">温数据</text><text x="200" y="376" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#0f172a">30 天 ~ 6 个月</text><text x="420" y="376" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155">对象存储 HDD 池</text><text x="1276" y="376" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#64748b" text-anchor="end">回放启动 ≤ 5 秒</text><rect x="30" y="396" width="1260" height="38" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><rect x="30" y="396" width="6" height="38" rx="3" fill="#7c3aed"/><text x="48" y="420" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#7c3aed">冷数据（归档）</text><text x="200" y="420" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#0f172a">6 个月 ~ 3 年</text><text x="420" y="420" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155">归档存储 / 磁带库</text><text x="1276" y="420" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#64748b" text-anchor="end">按需加载，恢复 ≤ 4 小时</text><rect x="30" y="440" width="1260" height="38" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/><rect x="30" y="440" width="6" height="38" rx="3" fill="#dc2626"/><text x="48" y="464" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626">到期清理</text><text x="200" y="464" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#0f172a">超过留存周期</text><text x="420" y="464" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155">安全擦除并留痕</text><text x="1276" y="464" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#64748b" text-anchor="end">清理前校验无调查任务关联</text><rect x="30" y="502" width="1260" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 4"/><text x="46" y="528" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">可靠性设计</text><text x="46" y="552" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#92400e">· 录像采集与转发并行：采集链路异常时按策略选择「断开会话」或「降级记录并告警」，不静默丢失；</text><text x="46" y="572" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#92400e">· 分片上传失败自动重试（指数退避，最多 5 次），连续失败触发告警并保留本地临时副本；</text><text x="46" y="592" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#92400e">· 会话结束后生成录像清单（分片数、总时长、整体 SM3、签名），作为取证与校验依据；定期批量校验检出静默损坏并自愈。</text><rect x="30" y="627" width="4" height="18" rx="2" fill="#2563eb"/><text x="42" y="642" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#0f172a">关键设计指标</text><rect x="30" y="660" width="240" height="46" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="1.3"/><text x="42" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#64748b">录像完整率</text><text x="42" y="699" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#16a34a">≥ 99.9%</text><rect x="284" y="660" width="240" height="46" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.3"/><text x="296" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#64748b">加密开销</text><text x="296" y="699" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#2563eb">≤ 5% CPU</text><rect x="538" y="660" width="240" height="46" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="1.3"/><text x="550" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#64748b">切片时延</text><text x="550" y="699" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#0d9488">≤ 200 ms</text><rect x="792" y="660" width="240" height="46" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.3"/><text x="804" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#64748b">回放启动</text><text x="804" y="699" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">≤ 2 s</text><rect x="1046" y="660" width="240" height="46" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.3"/><text x="1058" y="680" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#64748b">校验周期</text><text x="1058" y="699" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#d97706">每日增量 + 每周全量</text></svg>