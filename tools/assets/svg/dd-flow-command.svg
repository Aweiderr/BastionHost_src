" height="16" fill="#ffffff" stroke="none"/><text x="187.5" y="140" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">1 用户输入命令（Enter 触发提交流）</text><path d="M 266.25 176 L 423.75 176" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar2)" stroke-linecap="round"/><rect x="298" y="158" width="94" height="16" fill="#ffffff" stroke="none"/><text x="345" y="170" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">2 提交命令原文（含续行拼接）</text><path d="M 423.75 206 L 463.75 206 L 463.75 220 L 427.75 220" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ar3)"/><text x="469.75" y="212" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.5" fill="#334155">语法解析：管道 / 重定向 / 命令替换 / 串联拆分</text><path d="M 423.75 236 L 266.25 236" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar4)" stroke-linecap="round"/><rect x="272.8" y="218" width="144.39999999999998" height="16" fill="#ffffff" stroke="none"/><text x="345" y="230" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#64748b" text-anchor="middle">3 结构化命令（主命令 + 参数 + 复合结构）</text><path d="M 266.25 266 L 738.75 266" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar5)" stroke-linecap="round"/><rect x="455.5" y="248" width="94" height="16" fill="#ffffff" stroke="none"/><text x="502.5" y="260" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">4 读取会话策略集（本地缓存）</text><path d="M 738.75 296 L 266.25 296" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar6)" stroke-linecap="round"/><rect x="441.5" y="278" width="122" height="16" fill="#ffffff" stroke="none"/><text x="502.5" y="290" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#64748b" text-anchor="middle">5 策略集（命令黑白名单 / 危险等级）</text><path d="M 266.25 326 L 581.25 326" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar7)" stroke-linecap="round"/><rect x="373.95" y="308" width="99.6" height="16" fill="#ffffff" stroke="none"/><text x="423.75" y="320" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">6 策略匹配（多维度 + 正则）</text><path d="M 581.25 356 L 621.25 356 L 621.25 370 L 585.25 370" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar8)"/><text x="627.25" y="362" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.5" fill="#334155">按最严格优先裁决，输出动作</text><path d="M 581.25 386 L 266.25 386" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar9)" stroke-linecap="round"/><rect x="345.95" y="368" width="155.6" height="16" fill="#ffffff" stroke="none"/><text x="423.75" y="380" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#64748b" text-anchor="middle">7 判定结果：放行 / 告警 / 二次确认 / 阻断</text><path d="M 266.25 416 L 1053.75 416" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar10)" stroke-linecap="round"/><rect x="610.2" y="398" width="99.6" height="16" fill="#ffffff" stroke="none"/><text x="660" y="410" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">8 写命令审计记录（含命中规则）</text><path d="M 266.25 446 L 896.25 446" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar11)" stroke-linecap="round"/><rect x="542.65" y="428" width="77.19999999999999" height="16" fill="#ffffff" stroke="none"/><text x="581.25" y="440" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.3" fill="#1e293b" text-anchor="middle">9 放行：转发命令至资产</text><path d="M 896.25 476 L