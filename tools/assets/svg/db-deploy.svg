" stroke-width="2" marker-end="url(#ar11)" stroke-linecap="round"/><text x="1015" y="396" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">归档</text><rect x="30" y="552" width="620" height="190" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><rect x="46" y="537.08" width="80" height="26" rx="4" fill="#0891b2"/><text x="86" y="555.92" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">备份策略</text><rect x="50" y="582" width="580" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="62" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#155e75">全量备份</text><text x="190" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">每日 02:00，保留 7 份</text><text x="618" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">备份文件 SM4 加密</text><rect x="50" y="620" width="580" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="62" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#155e75">增量备份</text><text x="190" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">每小时一次，保留 24 份</text><text x="618" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">基于 WAL 归档</text><rect x="50" y="658" width="580" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="62" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#155e75">日志归档</text><text x="190" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">WAL 实时归档</text><text x="618" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">支持任意时间点恢复</text><rect x="50" y="696" width="580" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="62" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#155e75">异地备份</text><text x="190" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">每日同步至异地对象存储</text><text x="618" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">保留 90 天</text><rect x="670" y="552" width="640" height="190" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><rect x="686" y="537.08" width="94" height="26" rx="4" fill="#16a34a"/><text x="733" y="555.92" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">容灾与恢复</text><rect x="690" y="582" width="600" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="702" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#166534">同城灾备</text><text x="790" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">备库 + 只读副本部署于第二机房</text><text x="1278" y="603" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">RPO ≤ 1 分钟 / RTO ≤ 30 分钟</text><rect x="690" y="620" width="600" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="702" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#166534">异地灾备</text><text x="790" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">每日备份同步至异地，按需恢复</text><text x="1278" y="641" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">RTO ≤ 4 小时</text><rect x="690" y="658" width="600" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="702" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#166534">恢复演练</text><text x="790" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">每季度执行一次恢复演练</text><text x="1278" y="679" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">输出演练报告并归档</text><rect x="690" y="696" width="600" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="702" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#166534">数据校验</text><text x="790" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10.5" fill="#0f172a">备份文件定期校验可解密与完整性</text><text x="1278" y="717" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="10" fill="#64748b" text-anchor="end">每半年一次全量校验</text><text x="670" y="762" font-family="'Microsoft YaHei','HarmonyOS Sans SC','Segoe UI',sans-serif" font-size="11" fill="#334155" text-anchor="middle">高可用保障：主库故障由 Patroni / 哨兵自动选主，切换时间 ≤ 60 秒；切换期间写操作短暂失败由应用重试（最多 3 次，指数退避）。</text></svg>